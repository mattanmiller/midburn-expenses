<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול הוצאות משותפות - טיול/קמפ</title>
    <!-- טעינת Tailwind CSS לעיצוב נקי ומתקדם -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#06b6d4'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 mb-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">⛺ ניהול הוצאות משותפות</h1>
            <span id="sync-status" class="text-xs bg-indigo-700 px-3 py-1 rounded-full text-indigo-200">מסתנכרן עם הענן...</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 flex-grow w-full space-y-6 pb-12">

        <!-- ניהול משתתפים -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-semibold mb-3 text-gray-700">👥 חברי הקבוצה</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="new-member-name" placeholder="שם משתתף חדש..." class="flex-grow border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addMember()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl font-medium transition">הוסף</button>
            </div>
            <div id="members-list" class="flex flex-wrap gap-2">
                <!-- יוכנס דינמית -->
            </div>
        </section>

        <!-- הוספת הוצאה חדשה -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">💸 הוספת הוצאה חדשה</h2>
            <form id="expense-form" onsubmit="addExpense(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">תיאור ההוצאה</label>
                        <input type="text" id="expense-desc" required placeholder="למשל: סופרמרקט, דלק..." class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">סכום (₪)</label>
                        <input type="number" step="0.01" id="expense-amount" required placeholder="0.00" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">מי שילם?</label>
                        <select id="expense-payer" required class="w-full border border-gray-300 rounded-xl px-4 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <!-- יוכנס דינמית -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">תאריך</label>
                        <input type="date" id="expense-date" required class="w-full border border-gray-300 rounded-xl px-4 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold shadow transition">שמור הוצאה בענן</button>
            </form>
        </section>

        <!-- סיכום ומאזן -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- מאזן אישי -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">📊 מאזן אישי</h2>
                <div id="balances-list" class="space-y-3">
                    <!-- יוכנס דינמית -->
                </div>
            </div>

            <!-- המלצה לקישור חובות -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">💡 קיזוז חובות אופטימלי</h2>
                <div id="settlements-list" class="space-y-3">
                    <!-- יוכנס דינמית -->
                </div>
            </div>
        </section>

        <!-- רשימת ההוצאות -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border
